<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm File Transfer Engine</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: #e0e0e0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        input[type="file"] { margin-bottom: 12px; }
        #status { margin-top: 12px; font-weight: bold; color: #60a5fa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Wasm File Transfer Engine</h1>
        <div id="status">Status: Connecting to WebSocket server...</div>
        <br>
        <button id="connectBtn">Connect to Peer</button>
        <br><br>
        <input id="fileInput" type="file">
        <button id="sendBtn" disabled>Send File</button>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
